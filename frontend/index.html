<!doctype html>
<!-- Web page of AI Code Coach (hosted on Vercel). It sends each question to the
     backend API on Render (api.py) and shows the answer. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Code Coach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">

  <!-- marked: turns the AI's Markdown into HTML. DOMPurify: makes that HTML safe.
       KaTeX: draws math formulas. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">

  <style>
    :root {
      --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
      --border: #d8dee4; --accent: #2563eb; --user: #e8f0fe; --code: #f1f3f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #181b21; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #2c313a; --accent: #60a5fa; --user: #1e2a3d; --code: #0b0d10;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page { max-width: 900px; margin: 0 auto; padding: 24px 16px 140px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
    .toolbar label { padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
                     cursor: pointer; background: var(--panel); }
    .toolbar input { display: none; }
    .toolbar input:checked + span { color: var(--accent); font-weight: 600; }
    .toolbar label:has(input:checked) { border-color: var(--accent); }
    #clear { margin-left: auto; }

    button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--panel); color: var(--text); cursor: pointer; }

    .message { margin: 14px 0; padding: 12px 16px; border-radius: 12px; background: var(--panel);
               border: 1px solid var(--border); overflow-wrap: anywhere; }
    .message.user { background: var(--user); white-space: pre-wrap; }
    .message.error { border-color: #dc2626; color: #dc2626; }
    .role { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .message pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
    .message code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--muted); }
    .source-name { font-size: .85rem; color: var(--muted); margin-top: 10px; }

    form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
           border-top: 1px solid var(--border); padding: 12px 16px; }
    .form-inner { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
    textarea { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; resize: none;
               border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    #send { background: var(--accent); color: #fff; border: none; padding: 0 20px; }
    #send:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <div class="page">
    <h1>🤖 AI Code Coach</h1>
    <p class="subtitle">RAG-powered assistant for debugging, translating, and explaining your code.</p>

    <div class="toolbar">
      <label><input type="radio" name="task" value="Debug Code" checked><span>Debug Code</span></label>
      <label><input type="radio" name="task" value="Translate Code"><span>Translate Code</span></label>
      <label><input type="radio" name="task" value="Explain Algorithm"><span>Explain Algorithm</span></label>
      <button id="clear" type="button">Clear History</button>
    </div>

    <div id="chat"></div>
  </div>

  <form id="form">
    <div class="form-inner">
      <textarea id="question" rows="2" placeholder="Ask about your code... (Enter to send, Shift+Enter for a new line)" required></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

  <script>
    // Address of the backend API on Render.
    const API_URL = "https://ai-code-coach-kghe.onrender.com";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send");

    // Add one message box to the chat and return it.
    function addMessage(role, cssClass) {
      const box = document.createElement("div");
      box.className = "message " + cssClass;
      box.innerHTML = `<div class="role">${role}</div><div class="body"></div>`;
      chat.appendChild(box);
      box.scrollIntoView({ behavior: "smooth" });
      return box.querySelector(".body");
    }

    // Turn the AI's answer (Markdown with math like \[ x \] or \( x \)) into HTML.
    function renderAnswer(text) {
      // The Markdown converter would eat the backslashes in the math, so first
      // swap each formula for a placeholder (but leave ``` code blocks alone).
      const formulas = [];
      const parts = text.split("```");
      for (let i = 0; i < parts.length; i += 2) {  // parts 0, 2, 4... are outside code blocks
        parts[i] = parts[i].replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/g, (formula) => {
          formulas.push(formula);
          return `@@MATH${formulas.length - 1}@@`;
        });
      }
      const html = DOMPurify.sanitize(marked.parse(parts.join("```")));

      // Put each formula back, drawn by KaTeX.
      return html.replace(/@@MATH(\d+)@@/g, (_, n) => {
        const formula = formulas[n];
        return katex.renderToString(formula.slice(2, -2), {
          displayMode: !formula.startsWith("\\("),  // \( \) is inline, the others are on their own line
          throwOnError: false,
        });
      });
    }

    function showSources(body, sources) {
      const details = document.createElement("details");
      details.innerHTML = "<summary>View Context Sources</summary>";
      for (const { source, code } of sources) {
        const name = document.createElement("div");
        name.className = "source-name";
        name.textContent = "Source: " + source;
        const pre = document.createElement("pre");
        pre.innerHTML = "<code></code>";
        pre.firstChild.textContent = code;
        details.append(name, pre);
      }
      body.appendChild(details);
    }

    async function ask(question) {
      const task = document.querySelector("input[name=task]:checked").value;
      addMessage("You", "user").textContent = question;
      const answerBox = addMessage("AI Code Coach", "assistant");
      answerBox.textContent = "Thinking... (the first question can take up to a minute while the free server wakes up)";
      sendButton.disabled = true;

      try {
        const response = await fetch(API_URL + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task, question }),
        });
        if (!response.ok) throw new Error(`server answered ${response.status} ${await response.text()}`);
        const data = await response.json();
        answerBox.innerHTML = renderAnswer(data.answer);
        showSources(answerBox, data.sources);
      } catch (error) {
        answerBox.parentElement.classList.add("error");
        answerBox.textContent = "Something went wrong: " + error.message;
      } finally {
        sendButton.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || sendButton.disabled) return;
      input.value = "";
      ask(question);
    });

    // Enter sends, Shift+Enter makes a new line.
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("clear").addEventListener("click", () => { chat.innerHTML = ""; });
  </script>
</body>
</html>
